name = "shorts-atlas-api"
main = "worker/src/index.js"
compatibility_date = "2026-11-01"

# Workers AI, for the AI geocoder (free daily allowance; no key needed).
[ai]
binding = "AI"

[vars]
# AI geocoder: "off" turns it off. GEOCODER_MODE is "ai-verified" (AI has the final say on
# every video without a creator-set location) or "hybrid" (AI only fills rule gaps).
# Chosen from evals/results/latest.md.
# Optional: AI_MODEL (Workers AI model id), AI_BATCH (videos per call, default 20).
AI_GEOCODER = "on"
GEOCODER_MODE = "ai-verified"
# Comma-separated list of sites allowed to call the API. For local testing:
# npx wrangler dev --var ALLOWED_ORIGINS:http://localhost:8080 --var YOUTUBE_API_KEY:your-key
ALLOWED_ORIGINS = "https://shorts-atlas.pages.dev"

# Secrets: Cloudflare dashboard > Worker > Settings > Variables and Secrets (type Secret), never committed:
#   YOUTUBE_API_KEY   required
#   TURNSTILE_SECRET  optional, turns on the bot check
#   RATE_SALT         optional, any random string
