name = "shorts-atlas-api"
main = "worker/src/index.js"
compatibility_date = "2026-11-01"

[vars]
# Comma-separated list of sites allowed to call the API. For local testing:
# npx wrangler dev --var ALLOWED_ORIGINS:http://localhost:8080 --var YOUTUBE_API_KEY:your-key
ALLOWED_ORIGINS = "https://shorts-atlas.pages.dev"

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   YOUTUBE_API_KEY   required
#   TURNSTILE_SECRET  optional, turns on the bot check
#   RATE_SALT         optional, any random string
