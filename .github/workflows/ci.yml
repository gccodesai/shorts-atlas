name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - name: Offline geocoder eval (rules only, no keys)
        run: node evals/run.mjs > /dev/null && cat evals/results/latest.md >> "$GITHUB_STEP_SUMMARY"
